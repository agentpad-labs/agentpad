<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Pad — Genesis Passport</title>
<link rel="stylesheet" href="styles.v1.css">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="config.js"></script>
<style>
.card{border:1px solid var(--ink);padding:24px;max-width:560px;margin:24px auto;background:#fff}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--signal);color:#fff;padding:10px 18px;cursor:pointer;font-weight:700}
.btn.gray{background:#888}.btn[disabled]{opacity:.45;cursor:default}
.log{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#111;color:#9f9;padding:10px;min-height:60px;margin-top:12px}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:6px 0}
</style>
</head>
<body style="background:var(--paper,var(--paper,#f4f1ea));font-family:ui-monospace,monospace">
<main class="card">
<h2 style="margin-top:0">AGENT PAD — GENESIS PASSPORT</h2>
<p>Paspor Agent-Earned. Supply 7.777 · kuota 2/wallet · Agent ID wajib.</p>
<div class="kv"><span>Reactants</span><b>keping 1 — GRATIS via tantangan</b></div>
<div class="kv"><span>Penalty</span><b>keping 2 — 0,5 USDT</b></div>
<div class="kv"><span>Kontrak</span><b id="ppAddr" style="font-size:10px"></b></div>
<p><button class="btn" id="connect">1 · CONNECT WALLET</button></p>
<p><button class="btn gray" id="play" disabled>2 · MAIN TANTANGAN (GRATIS)</button>
<button class="btn gray" id="paid" disabled>3 · BELI 0,5 USDT</button></p>
<div class="log" id="log">siap.</div>
</main>
<script>

const PASSPORT = window.AGENTPAD.passport;
const API = window.AGENTPAD.challengeApi || "http://127.0.0.1:8907";
const ABI = ["function mint(uint256 epoch,uint256 promptId,bytes signature)","function mintPaid()","function mintedByWallet(address) view returns (uint256)","function challengeEpoch() view returns (uint256)","function totalMinted() view returns (uint256)"];
let provider, signer, wallet, contract;
const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += "\n> " + m; };

$("ppAddr").textContent = PASSPORT;

$("connect").onclick = async () => {
  provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  wallet = signer.address.toLowerCase();
  contract = new ethers.Contract(PASSPORT, ABI, signer);
  const used = Number(await contract.mintedByWallet(wallet));
  log("wallet: " + wallet + " · keping terpakai: " + used + "/2 · total tercetak: " + (await contract.totalMinted()));
  $("play").disabled = false; $("paid").disabled = used >= 2;
  $("paid").disabled = used >= 2; $("play").disabled = used >= 2;
};

$("play").onclick = async () => {
  try {
    log("minta tantangan…");
    const ch = await (await fetch(API + "/api/challenge", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ wallet }) })).json();
    if (ch.error) return log("GAGAL: " + ch.error);
    log("soal: " + ch.variables + " var / " + ch.clauses.length + " klausa · deadline " + ch.ttlSeconds + "dtk — solver jalan…");
    // walksat mini
    const n = ch.variables, asg = Array.from({length:n},()=>Math.random()<0.5);
    let solved = false;
    for (let it=0; it<80000 && !solved; it++){
      const unsat = ch.clauses.map((c,i)=>[c,i]).filter(([c])=>!c.some(l=>asg[Math.abs(l)-1]===l>0));
      if (!unsat.length){ solved = true; break; }
      const [c] = unsat[Math.floor(Math.random()*unsat.length)];
      let best=0, bestGain=-Infinity;
      for (const l of c){
        const v = Math.abs(l)-1;
        asg[v]=!asg[v];
        const bad = ch.clauses.filter(cc=>!cc.some(x=>asg[Math.abs(x)-1]===x>0)).length;
        asg[v]=!asg[v];
        if (-bad>bestGain){ bestGain=-bad; best=v; }
      }
      asg[best]=!asg[best];
    }
    if (!solved) return log("solver mentok — klik lagi (solusi selalu ada)");
    log("SOLVED ✓ — kirim jawaban…");
    const ownershipSig = await signer.signMessage(String(ch.promptId));
    const r = await (await fetch(API + "/api/submit", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ promptId: ch.promptId, assignment: asg, wallet, ownershipSig }) })).json();
    if (!r.ok) return log("DITOLAK: " + r.error);
    log("ttd didapat ✓ — mint on-chain (gas aja)…");
    const tx = await contract.mint(r.epoch, ch.promptId, r.signature);
    const rc = await tx.wait();
    log("MINT SUKSES ✓ tx: " + rc.hash);
  } catch (e) { log("ERR: " + (e.shortMessage || e.message)); }
};

$("paid").onclick = async () => {
  try {
    const usdt = new ethers.Contract(window.AGENTPAD.usdt, ["function approve(address,uint256) returns (bool)"], signer);
    log("approve 0,5 USDT…");
    const a = await (await usdt.approve(PASSPORT, ethers.parseUnits("0.5", 18))).wait();
    log("approve ✓ " + a.hash);
    const tx = await contract.mintPaid();
    const rc = await tx.wait();
    log("MINT BAYAR SUKSES ✓ " + rc.hash);
  } catch (e) { log("ERR: " + (e.shortMessage || e.message)); }
};
</script>
</body>
</html>
